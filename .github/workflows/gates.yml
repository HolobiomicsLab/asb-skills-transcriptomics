name: Domain content gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  released-collections:
    name: ${{ matrix.collection.collection_path }}
    strategy:
      fail-fast: false
      matrix:
        collection:
            - domain: transcriptomics
              collection_path: collections/transcriptomics/v2
              receipts_path: "receipts/b5a519a80508"
    # Pin the tooling commit recorded in collections.yaml for the release.
    # Bump this full commit SHA deliberately when adopting newer gate tooling.
    uses: HolobiomicsLab/asb-skill-collections/.github/workflows/domain-gates.yml@95cb2a07189cfc2776c644ad283cf9f621b9ca96
    with:
      domain: ${{ matrix.collection.domain }}
      collection_path: ${{ matrix.collection.collection_path }}
      receipts_path: ${{ matrix.collection.receipts_path }}
      strict: true
      edam_strict: true
