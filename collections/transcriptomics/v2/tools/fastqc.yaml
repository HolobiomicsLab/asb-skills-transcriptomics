evidence_spans:
- we recommend assessing read quality with a tool such as [FastQC]
- QC of fastq files is performed using [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/).
- BARtab leverages widely used bioinformatics tools including fastp, FLASh, cutadapt, samtools, bowtie, starcode, umi-tools, and FastQC
- '[FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) reports land in `results/<sample>/{dnaseq,rnaseq}/qualitycontrol/` per read group'
- All fastq files were reviewed for sequence quality using FastQC24
- All fastq files were reviewed for sequence quality using FastQC
