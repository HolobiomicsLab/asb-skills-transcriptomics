evidence_spans:
- counting methods such as SplAdder, sigcount (Canzar et al. 2016), htseq-count (Anders et al. 2015), or featureCounts (Liao et al. 2014).
- Raw RNA-seq reads were mapped to the hg19 transcriptome using TopHat2 [24], and featureCounts [25] was used to assign the reads to each gene.
- featureCounts was used to assign the reads to each gene
- FeatureCount from UMI-tools is employed to filter out reads that not align properly to this target gene.
- 'featureCounts: an efficient general purpose program for assigning sequence reads to genomic features'
- The featureCounts45 tool, with strandedness option set to 1 (-s 1) and paired-end option set (-p), was used to generate a count of each TAR features
- 'featureCounts: an efficient general purpose program for assigning sequence reads to genomic features'
- tiny-count can quantify reads aligned to a genome or directly to small RNA or transcript sequences.
