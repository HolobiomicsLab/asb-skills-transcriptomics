- 'We followed the guidelines on the RCTD GitHub repository: https://github.com/dmcable/spacexr'
- we follow RCTD’s strategy to accurately approximate γg by viewing ST data as a bulk RNA-seq data
- we replace the first step, Nucleus segmentation, with Singlet/Doublet classification inspired by RCTD
- RCTD4 uses the cell-type-specific mean expression of marker genes derived from a scRNA-seq reference to build a probabilistic model
