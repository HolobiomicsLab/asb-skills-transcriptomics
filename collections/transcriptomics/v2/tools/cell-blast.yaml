evidence_spans:
- a deep generative model (currently named **DIRECTi**)
- import Cell_BLAST as cb
- pip install Cell-BLAST
- '**Cell_BLAST** is a single cell transcriptome querying tool'
- we present Cell BLAST, an accurate and robust cell-querying method built on a neural network-based generative model
- A user-friendly Web server is publicly accessible at https://cblast.gao-lab.org, with all curated datasets and pretrained models available
- many automatic annotation tools have recently been developed, including SingleR [7], CHETAH [8], CellAssign [9], scMatch [10], scCATCH [11], scPred [12], SciBet [13], scVI [14], and Cell BLAST [15]
- others search for similar cells in a reference database (e.g., scmap8 and Cell-BLAST9)
- CELLBLAST and chetah, two annotators that actively identify new cell types
