evidence_spans:
- Reads are quality filtered using [fastp](https://github.com/OpenGene/fastp).
- BARtab leverages widely used bioinformatics tools including fastp, FLASh, cutadapt, samtools, bowtie, starcode, umi-tools, and FastQC
- Input FASTQ files were processed by fastp [44] to remove adapter and low-quality bases.
- '[fastp](https://github.com/OpenGene/fastp) writes the trimmed reads'
- which includes quality filtering or removal of adapter sequences. For that, fastp (Chen et al. 2018) is applied
