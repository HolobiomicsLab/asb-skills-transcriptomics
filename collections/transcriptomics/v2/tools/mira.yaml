evidence_spans:
- The CODAL model architecture extends MIRA28, our earlier method for variational topic modeling of single-cell RNA-seq and ATAC-seq data.
- The CODAL generative model is based on the earlier MIRA28 method for variational autoencoder-based inference of topics from scRNA-seq
- The CODAL topic model, an extension of the MIRA topic model, accounts for technical effect confounding biological signal in the analysis of multi-batch scRNA-seq, scATAC-seq, or multimodal data.
- We benchmarked CODAL against the MIRA topic model28, scanpy principal component analysis (PCA), scVI20, scANVI18, scanpy PCA+Harmony19, and scanorama25.
- We used the same MAP parameter inference procedure as MIRA.
- The CODAL generative model is based on the earlier MIRA28 method for variational autoencoder-based inference of topics
- The CODAL topic model is based on the earlier MIRA28 method for variational autoencoder-based inference of topics
