evidence_spans:
- CASi uses an artificial neural network built on Keras to annotate cells of $t_{1}$ data.
- library(keras)
- you will need to have the dplyr, mvtnorm, tensorflow, keras, ranger, devtools, liquidSVM, and xgboost libraries installed
- The Cyclum package is efficiently implemented in Python using Keras with TensorFlow and has been comprehensively tested.
- DCA is implemented in Python 3 using Keras53 and its TensorFlow54 backend.
- '.. automodule:: autoencoder.loss'
- classifer <- keras::load_model_hdf5(filepath =paste0(prefix, ".hdf5"))
- We use Keras to train our model.
- Using TensorFlow backend.
- The model was implemented in Keras version 2.2.2 with a Tensorflow (1.10.1) backend
- The model was implemented in Keras version 2.2.2 with a Tensorflow (1.10.1) backend [29].
- NeuCA uses keras as the application programming interface (API) to enable fast high-level neural network implementation.
- '[keras 2.6.0]'
- 'python module: tensorflow, keras, and numpy (version 2.8.0, 2.8.0, and 1.22.3, respectively)'
- train a neural network using the training subset and evaluate the model by predicting cell type proportions on the test subset
- It relies on calculating the predicted classes/loss function gradients with respect to the input variables, a method popularly known as Vanilla Gradient.
- + keras 2.0.6
- keras (Chollet et al. 2015)
- 'Among the publicly available packages or modules used in viRNAtrap are: * ctypes (https://docs.python.org/3/library/ctypes.html) * keras (Chollet et al. 2015) * numpy (Harris et al. 2020)'
- $ keras 2.1.2
- $ pip install keras
- '$ pip install tensorflow-gpu

  $ pip install keras'
- Keras version=2.2.4 and its backend is TensorFlow
