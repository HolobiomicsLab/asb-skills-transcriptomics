evidence_spans:
- Annotation performance was compared against five automatic annotation tools, ScType40, SCINA19, clustifyR12, scCATCH41, scSorter17.
- Popular methods in this category include SCINA16, Garnett17, scSorter18, transfer-learning based method ItClust19
- seven other algorithms, including CHETAH [7], SciBet [8], SCINA [9], scmap-cell [10], scmap-cluster [10], SingleR [11] and ikarus [12]
- Our unsupervised approach outperformed the prior knowledge-based methods scSorter30, SCINA33, and scCATCH34
- a prior knowledge-based methods that require either a marker gene set or a pre-trained classifier for the selected cell populations (e.g. scSorter30, SCINA33, and scCATCH34)
