evidence_spans:
- PhyloVision was run with default parameters, except for setting num_neighbors
- PhyloVision additionally supports a phylogenetic analysis with Hotspot, which can be invoked with the runHotspot function
- PhyloVision clusters cells on a phylogeny by performing a breadth-first search over internal nodes
- PhyloVision enables users to quantify the plasticity of a particular categorical metadata for each leaf on the tree
