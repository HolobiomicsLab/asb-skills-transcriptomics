evidence_spans:
- cell barcodes are identified in R1 using [umi-tools whitelist](https://umi-tools.readthedocs.io/en/latest/reference/whitelist.html).
- Error correct UMIs and count UMIs per barcode using `umi-tools` [UMITOOLS_COUNT](#umitools_count)
- 'to benchmark four UMI deduplication tools: UMI-tools, STARsolo, and cellranger (gene-level), as well as Alevin (transcript-level)'
- umi_tools [63] was adopted to append the barcode and UMI information to the sequence header of read 2
