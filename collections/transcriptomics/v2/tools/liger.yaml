evidence_spans:
- Seurat16,17, LIGER18, and scMerge19 attempt to identify shared variations across batches
- which was inspired by the methodology used by LIGER40 for inter-sample harmonization
- There are already interpretable batch integration methods, such as LIGER7, which is based on non-negative matrix factorisation-based (NMF)
- There are many well-established integration methods available to address batch effects in scRNA-seq datasets, for example, Seurat, Harmony, and LIGER
- 'We have compared our method against eleven state-of-the-art integration methods: scVI20, Scanaroma16, Harmony15, Seurat17, BBKNN18, INSCT48, LIGER19, iMAP22, scANVI30, scGEN31 and scDML33'
- 'We have compared our method against eleven state-of-the-art integration methods: scVI20, Scanaroma16, Harmony15, Seurat17, BBKNN18, INSCT48, LIGER19, iMAP22, scANVI30, scGEN31 and scDML33.'
- '[LIGER](https://github.com/welch-lab/liger)'
- We benchmarked the results against four popular tools, Seurat v5, Harmony, LIGER, and Combat-seq, which were developed for this purpose.
- LIGER which utilises integrative non-negative matrix factorization (iNMF)22
- scPhere performed better than state-of-the-art batch-correction methods such as Harmony, Seurat3 CCA, LIGER
