name: simpleaf
slug: simpleaf
version_used: null
edam_topics: []
evidence_spans:
- '``simpleaf`` is a program to simplify and customize the running and configuration of single-cell processing with `alevin-fry'
- '`simpleaf` encapsulates the process of creating an expanded reference for quantification into a single command (`index`) and the quantification of a sample into a single command (`quant`)'
- The ``--chemistry`` option can take either a string describing the specific chemisty, or a string describing the geometry of the barcode, umi and mappable read
- The ``simpleaf workflow get`` command helps fetch the files of a registered simpleaf workflow to a local directory.
