evidence_spans:
- an R/Bioconductor package which interfaces directly with single cell classes in Bioconductor
- corral, an R/Bioconductor package that interfaces directly with Bioconductor classes (including SingleCellExperiment)
- decoupleR, a Bioconductor and Python package containing computational methods to extract these activities within a unified framework.
- interfaces easily with existing single cell software platforms such as Seurat, Bioconductor, and Scanpy
- '**Bioconductor version**: `r BiocManager::version()`'
- ExpHunter Suite is implemented as an R/Bioconductor package available from https://bioconductor.org/packages/ExpHunterSuite
- '`r BiocManager::version()`'
- Bioconductor version
- 'Bioconductor: open software development for computational biology and bioinformatics'
- A software implementation is available at https://bioconductor.org/packages/nnSVG
- BiocStyle::html_document
- freely available from Bioconductor at https://bioconductor.org/packages/nnSVG
- Our methodology is implemented in the nnSVG R package within the Bioconductor framework
- using the current state-of-the-art packages from the Bioconductor project (Huber et al., 2015)
- Note that `zinbwave` requires R (>=3.4) and Bioconductor (>=3.6).
