evidence_spans:
- library(biomaRt)
- 'library(GEOquery)

  library(biomaRt)

  library(dplyr)'
- Firstly Biomart was used to download lists of genes that were annotated to the cell cycle
- one solution is to use `biomaRt` R package to convert the gene name to make sure they are consistent each other.
- query Gene Ontology through Ensembl via biomaRt and pathway databases (KEGG, Reactome, Biocarta, PID:NCI-Nature, Panther, PharmGKB) via graphite
- We use the Tabula Muris and Tabula Sapiens Smartseq-2 lung dataset as example.
- we use biomaRt to map chromosome positions to HGNC symbols
