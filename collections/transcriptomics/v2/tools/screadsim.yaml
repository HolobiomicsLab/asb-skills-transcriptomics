- We deployed scReadSim with the default setting (generating scRNA-seq reads from the genome instead of the collapsed transcriptome
- Taking the three inputs, scReadSim generated synthetic scATAC-seq reads in FASTQ and BAM files
- we introduce scReadSim, a single-cell RNA-seq and ATAC-seq read simulator that allows user-specified ground truths and generates synthetic sequencing reads
