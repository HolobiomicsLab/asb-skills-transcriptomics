- minimap2 -d atac/ref.mmi reference/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz
- Reads in the fastq files were aligned using minimap2 according to the ENCODE standard parameters
- '[Minimap2](https://github.com/lh3/minimap2) if not using STARlong'
