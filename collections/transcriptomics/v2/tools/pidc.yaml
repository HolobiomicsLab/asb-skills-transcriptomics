evidence_spans:
- Using GRouNdGAN, we benchmark eight GRN inference methods
- present simulation results to validate the methodology
- Top-performing single cell GRN methods based on a recent benchmark study like ppcor,16 PIDC,17 and GRNBOOST2,18 present diverse approaches to GRN construction
- PIDC uses partial information decomposition based on the multivariate information theory to quantify the statistical dependencies between genes
