evidence_spans:
- conda create --name bidcell python=3.10
- We create the conda environment from the environment.yml provided and install the package from git
- conda create -n capital python=3.8 graphviz
- 'Create a new environment for CAPITAL (recommended)::'
- (Recommended) Use python virutal environment with conda（https://anaconda.org/）
- conda create -n deepcciEnv python=3.7.4 pip
- conda install -c bioconda -c conda-forge flexiplex
- 'You can also install Flexiplex using Anaconda: `conda install -c bioconda -c conda-forge flexiplex`'
- conda env create -f $FST_SAMPLE_DIR/forseti/envs/build_spliceu_r.yml
- conda env create -f $FST_SAMPLE_DIR/forseti/envs/forseti.yml
- Most of the software used in the default workflow can be installed in an automated fashion using Snakemake's [--use-conda]
- Given conda is installed on your system the pipeline can be set up using `snakedeploy`
- conda env create -n Metadensity --file environment.yaml
- Pollock is available to run in a Docker image (see below) or can be installed with Conda.
- Install the scBonita conda environment from the provided yml file OR the provided spec-file (PREFERRED)
- conda install conda-pack
- conda env create -n scing --file install/scing.environment.yml
- 'Recommended conda version: 4.12.0'
- conda env create -f environment.yml
- '``conda create -n <env name> python=3.9``'
- conda create -n <env name> python=3.9
- we strongly recommend that Conda be upgraded to at least v23.11 which uses the faster `libmamba` solver
- $ conda install -c bioconda stream
- $ conda create -n env_stream python=3.7 stream=1.0 jupyter
- conda create -n env_stream python=3.7 stream=1.0 jupyter
- conda env create --file environment.yml
- "conda env create --file environment.yml\n    conda activate twas_sim"
- 'conda env create --file environment.yml  # create envrionment with dependencies'
