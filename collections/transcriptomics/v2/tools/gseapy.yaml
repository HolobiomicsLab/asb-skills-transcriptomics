evidence_spans:
- enrichr/gseapy KEGG enrichment
- enrichment analysis via the package gseapy (https://github.com/zqfang/GSEApy) which uses the GSEA method27
- zqfang/GSEApy
- gene set enrichment analysis was performed using the enrichr function in gseapy v1.0.4 package in python
- The identified markers were subsequently employed for enrichment analysis with the Python package GSEApy109.
- run KEGG pathway enrichment (gseapy.enrichr, Fisher exact test)
- For basic usage of VEGA on training the model and analyzing pathway activities (including differential tests)
