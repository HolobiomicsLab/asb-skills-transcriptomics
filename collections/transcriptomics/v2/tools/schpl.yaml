evidence_spans:
- scHPL (single-cell Hierarchical Progressive Learning) is a method that automatically finds relationships between cell populations across multiple datasets
- For each node in the tree either a linear SVM, kNN, or one-class SVM is trained.
- Here, we present scHPL, a hierarchical progressive learning method which allows continuous learning from single-cell data
- scHPL is available at https://github.com/lcmmichielsen/scHPL
