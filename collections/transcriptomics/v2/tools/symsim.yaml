evidence_spans:
- We used SymSim v0.0.0.9000 in R v4.1.1 to simulate tree differentiation trajectories with 10000 cells, 20000 genes, and 4 cell types.
- Estimate SymSim/Splatter parameters from the Perturb-seq (and optionally MARS-seq) data, simulate DE datasets
- We perform three experiments to test the clustering performance of scMDC and generate 10 datasets in each experiment.
- SymSim is an R package made to simulate single cell RNA-seq data
- SimulateTrueCounts generates true transcript counts for the given number of genes and cells
- True2ObservedCounts then simulates the library preparation and sequencing procedures, and convert the true transcript counts into observed read counts or UMI counts
- For a single population, **BestMatchParams( )** returns parameters to generate datasets with similar statistical properties as a given input real dataset.
- Here, we present SymSim, a simulator that explicitly models the processes that give rise to data observed in single cell RNA-Seq experiments.
- devtools::install_github('YosefLab/SymSim')
- SymSim is an R package made to simulate single cell RNA-seq data.
