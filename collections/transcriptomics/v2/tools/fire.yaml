- We propose Finder of Rare Entities (FiRE), an algorithm that, in a matter of seconds, assigns a rareness score to every individual expression profile under study.
- This file is part of FiRE.
- While RaceID15 and GiniClust16 offer binary predictions, FiRE gives a rareness score to every individual expression profile.
