evidence_spans:
- scRNA-seq tailored unsupervised methods, such as SIMLR9, CellTree10, SC311, TSCAN12, and DIMM-SC13
- clustering methods such as hierarchical clustering, K-means, SNN-Cliq [18], Corr [19], SC3 [20], and SIMLR [21]
- Those methods include RaceID54, SCUBA55, SNN-Cliq56, ZIFA57, t-SNE4, SC349; just to name a few.
- Many single cell clustering methods were proposed, including Seurat10, SC311, TSCAN12
- Clusters computed by SC385 are included as well.
- Widely-used methods in this category include SC39, SEURAT10, SINCERA11, CIDR12, and SCANPY13
- SC3 employs spectral clustering to obtain individual clustering results based on the distance matrices derived from the Euclidean, Pearson and Spearman metrics
- SC3 (single-cell consensus clustering) [9] is a consensus method applying k-means on transformed distance matrices using PCA or eigenvectors of Laplacian
- We are using single-cell consensus clustering (SC3)37 as an exemplary clustering method
- We are using single-cell consensus clustering (SC3)37 as an exemplary clustering method that is commonly used to solve scRNA-Seq clustering problems.
- compared to the widelyused software package SC3
- Multiple clustering algorithms have been developed, including Seurat [11], SC3 [12], SIMLR [13], ZIFA [14], CIDR [15], SNN-Cliq [16], and Corr [17].
