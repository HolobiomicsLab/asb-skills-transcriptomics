- '- `alra(A_norm, k, q, quantile.prob, use.mkl, mkl.seed)`'
- To check if ALRA is preserving the signal, we computed the top k PCs (where k was chosen using the jackstraw method, see methods)
- We sampled random subsets of sizes 5000, 10,000, 20,000, 30,000, 40,000, and 50,000 cells from Hrvatin et al. and compared the runtime of ALRA and other imputation methods on each subset.
