evidence_spans:
- Monocle 2 addresses many of these challenges but is not designed to reconstruct trajectories between any two chosen cell states
- Limitations include reconstructing linear trajectories (Waterfall, Monocle 1)
- Examples of such work provided early inspiration for single-cell pseudotime methods, e.g., Monocle2.
- PhEMD required the use of Monocle 2 (Trapnell et al, 2014) to perform normalization, dimension reduction, and clustering of cells.
- For the retinoic acid dataset, we apply Monocle 2
- such as monocle 2 and Seurat7,8
- Monocle 2 are widely used for scRNA-seq clustering and the inference of single-cell trajectories
- we reconstruct the single-cell trajectory of HSMM differentiation using Monocle 2 (Qiu et al., 2017)
