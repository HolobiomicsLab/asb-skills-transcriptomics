evidence_spans:
- In scRNA-seq clustering of cells, SCCAF11 uses a self-projection machine learning approach on a pre-clustered dataset
- If query data has unseen cell types not in reference, MASI in combination with SCCAF can be used to identify subtypes within major cell types.
- We also develop a new biology conservation metric to address the maintenance of cell type distinguishability.
