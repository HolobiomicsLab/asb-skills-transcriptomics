evidence_spans:
- scTE makes BAM/SAM file as input, highly recommend to use unfiltered alignment file as input.
- $ scTE -i inp.bam -o out -x mm10.exclusive.idx --hdf5 True -CB CR -UMI UR
- $ scTE -i inp.bam -o out -x mm10.exclusive.idx -CB False -UMI False
- the only tool developed for the analysis of TEs in scRNA-Seq datasets is scTE14, which summarizes TE expression on metagenes corresponding to TE families
- We found that our tool is faster and uses less computational resources than scTE.
