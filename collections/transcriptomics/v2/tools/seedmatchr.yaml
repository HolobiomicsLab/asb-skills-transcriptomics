- '''SeedMatchR'' provides tools for exploring and detecting potential seed-mediated off-target effects of siRNA in RNA-seq'
- You can perform a seed match for a single seed using the `SeedMatchR()` function.
- The function `deseq_fc_ecdf` is designed to work directly with a DESeq2 results data frame.
- SeedMatchR is an R package developed to provide users a single, unified resource for detecting and visualizing seed-mediated off-target effects of siRNA using RNA-seq experiments.
