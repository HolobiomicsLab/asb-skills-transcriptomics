name: GENIE3
slug: genie3
version_used: null
edam_topics: []
evidence_spans:
- Using GRouNdGAN, we benchmark eight GRN inference methods
- We used two regulatory network inference tools (GENIE3118 and GRNBoost119) to replace the GRN from GNIPLR
- present simulation results to validate the methodology
- GENIE3 decomposes the prediction of a gene network between p genes into p different regression problems, and uses tree-based ensemble methods
- It uses a random forest, a weak learner ensemble method, to predict the expression profile of each target gene from profiles of all the other genes.
- We use all default parameters and choose 100 trees for computational feasibility reasons.
