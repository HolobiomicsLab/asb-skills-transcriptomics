evidence_spans:
- we propose a single-cell deep clustering model via a dual denoising autoencoder with bipartite graph ensemble clustering called scBGEDA
- scBGEDA outperforms other state-of-the-art methods on these datasets
- scBGEDA was able to identify cell-type specific marker genes and provide functional genomic analysis by quantifying the influence of genes on cell clusters
- a bipartite graph ensemble clustering algorithm is designed to exploit the relationships between cells and the learned latent embedded space
