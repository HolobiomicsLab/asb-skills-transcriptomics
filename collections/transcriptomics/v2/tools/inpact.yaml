evidence_spans:
- 'InPACT is a computational method that could be used to identify IPA sites by combining two modules: the sequence module'
- we propose a computational method called InPACT, which allows for the precise characterization of IPA from conventional RNA-seq data
- the IPA sites identified by InPACT, APAIQ, and IPAFinder from RNA-seq data were compared with those captured in the 3’ end sequencing data
- Subsequently, InPACT, APAIQ and IPAFinder were employed to predict IPA sites for each simulated RNA-seq data.
- InPACT is a computational method that could be used to identify IPA sites by combining two modules
- we applied InPACT to identify novel IPA sites and assemble novel IPA isoforms from these RNA-seq data
