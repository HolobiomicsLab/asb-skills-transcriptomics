- The processed AnnData was used as the input for running scTriangulate (win_fraction_cutoff = 0.3, add_metrics = ’tfidf5’).
- The combined AnnData serves as the input for the downstream scTriangulate analysis (win_fraction_cutoff = 0.25).
- The AnnData after Leiden clustering was subjected to scTriangulate (win_fraction_cutoff = 0.25, add_metrics = ’tfidf5’) as input.
