evidence_spans:
- We compared cTP-net with an anchor-based transfer-learning method developed in Seurat v3
- clustering scRNA-seq first and then transfer the labels to scATAC-seq (i.e. Seurat V3)
- Seurat v3 [8] explores the pairwise relationship between cells and constructs the shared nearest neighbor graph to identify cell types.
- For Seurat v3, we identified anchors and classified cells using the FindTransferAnchors function and TransferData functions
- The scripts for producing all the quantitative results in our manuscript can be found in [scripts](./scripts).
