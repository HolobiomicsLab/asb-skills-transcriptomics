evidence_spans:
- SAVER and scImpute may be extremely slow on scRNA-seq datasets with over 100,000 cells
- scImpute and SAVER both take over 10 h for 10,000 cells and were not attempted on larger matrices.
- scImpute11 uses a mixture of Gaussian and Gamma model
- most notable among these are MAGIC, scImpute, and drImpute
- AutoImpute, scImpute, and MAGIC successfully recover the majority of true zeros in the data
- current approaches for scRNA-seq specific imputation include scImpute22, which defines likely dropout values using a mixture model
- '`scImpute` is developed to accurately and efficiently impute the dropout values in scRNA-seq data.'
- scImpute uses a Gaussian distribution to model the actual expression
- Methods in this category include scImpute16, SAVER17, and BISCUIT18.
