evidence_spans:
- we develop Cyclum, an autoencoder approach identifying circular trajectories in the gene expression space
- Cyclum is a package that infer latent periodic process (e.g., cell cycle) from single-cell RNA-seq data.
- It provides methods to recover cell cycle information and remove cell cycle effects from the scRNA-seq data.
- existing methods yield poor circadian phase estimates, and do not quantify estimation uncertainty
