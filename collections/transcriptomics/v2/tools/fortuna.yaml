evidence_spans:
- Steps B and C are executed using fortuna's "--index" command.
- Here, we propose fortuna, a method that guesses novel combinations of annotated splice sites to create transcript fragments.
- Optionally ("--refine"), fortuna incorporates novel splice sites identified by any spliced aligner (such as STAR) from previously unmapped reads.
- For a complete list of options, run fortuna without any parameters.
- Fortuna requires C++11 to run and CMake version >=2.8.12 to compile.
- fortuna also allows to transform (```--trans```) signature counts to subexon counts as used by DEXSeq for alternative downstream analysis.
derived_from:
