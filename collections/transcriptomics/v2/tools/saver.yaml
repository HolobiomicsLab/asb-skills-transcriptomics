evidence_spans:
- Huang et al. (2018) applied SAVER to the Drop-seq data and demonstrated that, as compared to the raw data, the estimated distribution of expression values is more consistent with the FISH
- While other methods such as SAVER and scImpute do preserve biological zeros
- Notably, SAVER’s option of ‘do.fast’ was set to true.
- SAVER10 assumes negative binomial distribution
- '## https://github.com/mohuangx/SAVER'
- library(SAVER)
- MAGIC20 and SAVER21, on the other hand, denoise single-cell gene expression data and generate a denoised output for each gene and cell entry
- we also noticed another imputation method SAVER17, which borrows information across genes using a Bayesian approach
- SAVER17 models read counts as a mixture of Poisson-Gamma distribution and then uses a Bayesian approach
- SAVER12, SAVER-X16, bayNorm17, scImpute13, and VIPER18 are the prominent methods of this group.
