evidence_spans:
- 'Downstream 2: Patterns to functions (GSEA)'
- 'Gene set enrichment analysis: a knowledge-based approach for interpreting genome-wide expression profiles'
- Gene set enrichment analysis (GSEA) was applied to the list of genes using clusterProfiler [22,23].
- We also performed gene set enrichment analysis (GSEA)28,29 of the genes discovered ab initio using Cyclum, PC1, and PC2 on the mESC dataset.
- competitive test methods such as PAGE13, GSEA14, and CAMERA15
- we applied gene set enrichment (GSEA)34 analysis using the top MeC genes (Methods).
- including threshold-free methods such as the popular tool GSEA (Subramanian et al. 2005) which does not require an a priori stratification
- 'Gene set enrichment analysis: a knowledge-based approach for interpreting genome-wide expression profiles'
- Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment analysis of the differentially expressed genes, represented by adjusted p-values obtained from GSEA
- performed gene set enrichment analysis (GSEA)34 on the genes exhibiting the most significant increases in local entropy
- To this end, we resorted to Gene Set Enrichment Analysis (GSEA)44.
