evidence_spans:
- Some methods such as DCA and MAGIC treat all zeros as “missing data” and output a matrix in which every gene is expressed in every cell
- ALRA and MAGIC are significantly faster than the other methods, taking ~40 min on 50,000 cells.
- AutoClass but not the regular autoencoder was able to recover cell type pattern, indicating the classifier component is necessary
- AutoClass but not the regular autoencoder was able to recover cell type pattern
- most notable among these are MAGIC, scImpute, and drImpute
- AutoImpute, scImpute, and MAGIC successfully recover the majority of true zeros in the data
- MAGIC20 and SAVER21, on the other hand, denoise single-cell gene expression data and generate a denoised output for each gene and cell entry
- Once the data imputation is needed, scDrug also integrates MAGIC [37] to impute missing values.
- MAGIC is the first available method for explicit and genome-wide imputation of single-cell gene expression profiles16.
- MAGIC imputes zero values using heat diffusion25.
- Methods in this category include MAGIC20, DrImpute21, scScope22, DCA23, and DeepImpute24.
- We run MAGIC using the Scanpy implementation with default parameters and the approximate solver for computational speed.
- MAGIC78, a widely used method for imputing missing values to overcome zero-inflation in scRNA-Seq data, was applied to both datasets
- MAGIC was downloaded from https://github.com/pkathail/magic.
- We use scVI4 and MAGIC18 for the imputation.
