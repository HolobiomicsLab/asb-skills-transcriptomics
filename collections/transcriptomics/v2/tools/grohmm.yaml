evidence_spans:
- We used groHMM18 to predict transcribed regions from aligned scRNA-seq data in a strand-specific manner without annotations.
- TAR annotations were generated by running groHMM on the combined Space-Ranger-derived alignment files
- Please manually install [groHMM](https://bioconductor.org/packages/release/bioc/html/groHMM.html)
- We ran groHMM on read fragments to generate TARs.
