evidence_spans:
- A curated dataset of Microarrays samples. The samples are MDI-induced pre- adipocytes (3T3-L1) at different time points/stage of differentiation
- This package is for documenting and distributing a curated dataset of gene expression from MDI-induced 3T3-L1 adipocyte cell model
- The curated datasets are available as an R/Bioconductor experimental data package curatedAdipoArray.
