evidence_spans:
- Some approaches, such as SCEVAN and CopyKAT, attempt to distinguish malignant cancer cells in single-cell RNA-seq through CNV calling
- To calculate inferred CNV status we offer a built in argument to run CopyKAT CNV inference.
- with CopyKAT v1.0.5 and inferCNV v1.4.0.
- how to accurately distinguish between multiple malignant and non-malignant cell populations for targeted treatments remains a translational challenge
- Cancer-Finder, CaSee14, CopyKAT13, SCEVAN35 and ikarus17 were evaluated on the 10 external validation datasets via the default parameters for fairness.
- CopyKAT, SCEVAN and ikarus were evaluated on a CPU platform, whereas CaSee and Cancer-Finder were examined on a GPU platform.
- CopyKAT is another recently proposed method that leverages a polynomial dynamic programming model to smooth the transformed data along genomic coordinates
