evidence_spans:
- code for class `CAFEHGenotype` for fitting CAFEH with individual level data
- You can use CAFEH as a command line tool or a python package.
- The `.model` file is a pickle of the CAFEH model.
- 'git clone https://github.com/karltayeb/cafeh.git ... pip install .  # install package in cafeh environment'
- python cafeh.py --mode z -R example/LD_example.tsv -z example/z_example.tsv -n example/n_example.tsv --out output --save-model
- '`cafeh/cafeh_summary.py`: code for class `CAFEHSummary` for fitting CAFEH with summary stats'
