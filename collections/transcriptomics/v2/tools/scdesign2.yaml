evidence_spans:
- You can optionally clone the scGAN, BEELINE, scDESIGN2, and SPARSim submodules to also get the specific version of repositories that we used in our study.
- achieves better clustering accuracy and robustness on simulated and real datasets
- Version 1.0.0 of the scDesign2 package was used for generating simulation data.
- scReadSim trains the count simulator scDesign26 (if the cells belong to distinct clusters; otherwise, scDesign322 can be used if the cells follow continuous trajectories)
- scReadSim trains the count simulator scDesign2 on the pre-processed peak-by-cell and non-peak-by-cell count matrices from real data.
- scReadSim trains the count simulator scDesign26 on the pre-processed gene- and inter-gene-by-cell UMI count matrices from real data
- The current version of scReadSim implement [scDesign2](https://github.com/JSB-UCLA/scDesign2) to generate synthetic count matrix
- scReadSim trains the count simulator scDesign2
- The current version of scReadSim implement [scDesign2](https://github.com/JSB-UCLA/scDesign2) to generate synthetic count matrix based on the constructed count matrix from the input BAM file.
