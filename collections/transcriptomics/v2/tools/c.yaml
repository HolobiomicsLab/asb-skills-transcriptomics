- C++ 17 compliant compiler (gcc/clang)
- A modern c++ compiler with c++11 support.
- A modern c++ compiler with c++11 support. Supports Gnu g++, clang++ and Intel icpc.
- Use the C project src/c/fastq\_umi\_clipper.
- Next step is to find all of the positions where a UMI maps in the genome. You do with with the C project in src/c/umi_analyzer_uthash.
- The compiled program takes a FASTQ file and filters on any substring of your choice.
- using a scripting language for this task is far too slow. Fortunately there are C implementations of hashes.
