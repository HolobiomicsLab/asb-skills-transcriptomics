evidence_spans:
- remotes::install_github("carmonalab/UCell")
- These functions are more computationally efficient implementation of UCell and AddModuleScore (also known as ‘score_genes’ in Scanpy)
- computationally efficient implementation of UCell and AddModuleScore
- Existing single-cell pathway activity scoring methods, such as AddModuleScore7,8, UCell9, and AUCell10 can generate pathway activity scores (PAS) for individual cells
- These functions are more computationally efficient implementation of UCell and AddModuleScore
- compute PAS by “fast_ucell”
- UCell calculates gene signature scores for scRNA-seq data based on the Mann-Whitney U statistic [7].
- '`ScoreSignatures_UCell`    Calculate module enrichment scores from single-cell data.'
- UCell calculates gene signature scores for scRNA-seq data based on the Mann-Whitney U statistic
- '`SmoothKNN` Perform signature score smoothing using a weighted average of the scores of the first k nearest neighbors (kNN).'
- UCell is an R package for evaluating gene signatures in single-cell datasets.
