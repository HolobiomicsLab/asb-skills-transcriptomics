evidence_spans:
- RSCanner scans the secondary structure provided along with Shannon entropy values in sliding windows covering the entire RNA
- it computes nucleotide positions with BPC values above a user-defined cutoff (default = 50th percentile) and Shannon entropy values below a user-defined cutoff
- Rscript RSCanner_CT_shannon.R <input_structure.ct>  <shannon.txt>
