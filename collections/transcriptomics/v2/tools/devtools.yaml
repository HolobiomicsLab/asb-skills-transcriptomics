evidence_spans:
- library(devtools)
- devtools::install_github("elisabettasciacca/DEGGs", build_vignettes = TRUE)
- '# install.packages("devtools")'
- Simply run `library(devtools)` and then `install_github("UPSUTER/GEMLI", subdir="GEMLI_package_v0")`
- install.packages(c("devtools", "jetset", "readxl", "psych", "GGally", "gplots", "ggplot2", "RColorBrewer", "data.table", "grid", "gridExtra", "ggthemes", "scales","rlist"))
- library(devtools)
- devtools::install_github("XiaoZhangryy/iSC.MEB")
- devtools::install_github("BIGslu/kimma")
- '# install.packages("devtools")'
- 'install.packages("devtools")

  library(devtools)

  install_github("lhe17/nebula")'
- install_github("lhe17/nebula")
- 'To install the package, simply run

  ```

  devtools::install_github("rmoffitt/pdacR")

  ```'
- 'To install the package, simply run

  devtools::install_github("rmoffitt/pdacR")'
- install.packages("devtools")
- if (!requireNamespace("devtools", quietly = TRUE)) install.packages("devtools")
- devtools::install_github("PaulingLiu/ROGUE")
- To install scATOMIC you will need to use the devtools package.
- devtools::install_github("MengQiuchen/scDecouple", build_vignettes = TRUE)
- devtools::install_github("JSB-UCLA/scDEED")
- 'library(devtools)

  devtools::install_github("JSB-UCLA/scDEED")'
- devtools::install_github("CostaLab/scMEGA", force = TRUE)
- devtools::install_github("diegommcc/SpatialDDLSdata")
- if (!requireNamespace("devtools", quietly = TRUE)) { install.packages("devtools") }
- You will first have to have [devtools](https://github.com/hadley/devtools) package installed.
